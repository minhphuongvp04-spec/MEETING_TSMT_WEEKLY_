<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: fixed left rail of modules + scrolling work area; today board = two columns (actions | next 7 days) */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --sunk:#F6F8FA; --ink:#15202B; --muted:#5A6774; --line:#D8DFE6;
  --accent:#1F56C3; --accent-soft:#E3EBFA; --ok:#1C7F47; --ok-soft:#E1F2E8; --warn:#A86A0C; --warn-soft:#FBF0DC;
  --bad:#BD2D2D; --bad-soft:#FBE5E3; --info:#4A5A6B; --info-soft:#E9EDF1;
  --f-body:"IBM Plex Sans","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-head:"IBM Plex Sans Condensed","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E141A; --surface:#161F28; --sunk:#121A22; --ink:#E4EAF0; --muted:#93A2B1; --line:#27333F;
  --accent:#7FA6FF; --accent-soft:#1C2A45; --ok:#5CC48A; --ok-soft:#14301F; --warn:#E3A945; --warn-soft:#352812;
  --bad:#F07A72; --bad-soft:#3A1A19; --info:#A9B6C3; --info-soft:#1E2833; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E141A; --surface:#161F28; --sunk:#121A22; --ink:#E4EAF0; --muted:#93A2B1; --line:#27333F;
  --accent:#7FA6FF; --accent-soft:#1C2A45; --ok:#5CC48A; --ok-soft:#14301F; --warn:#E3A945; --warn-soft:#352812;
  --bad:#F07A72; --bad-soft:#3A1A19; --info:#A9B6C3; --info-soft:#1E2833; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px;min-height:100vh;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px}
.side{position:sticky;top:20px;align-self:start;display:flex;flex-direction:column;gap:18px}
.brand h1{font-family:var(--f-head);font-size:21px;font-weight:700;margin:0;letter-spacing:.01em}
.brand p{margin:2px 0 0;color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:6px;color:var(--ink);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--surface)}
.nav a.on{background:var(--ink);color:var(--bg)}
.nav .cnt{font-family:var(--f-mono);font-size:11px;padding:1px 6px;border-radius:9px;background:var(--bad);color:#fff}
.nav a.on .cnt{background:var(--bad)}
.sidefoot{display:flex;flex-direction:column;gap:8px;font-size:12px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--muted);padding:5px 10px;font:inherit;cursor:pointer}
.seg button.on{background:var(--accent);color:#fff}
main{min-width:0;display:flex;flex-direction:column;gap:18px}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px}
.top h2{font-family:var(--f-head);font-size:28px;font-weight:600;margin:0;text-wrap:balance}
.top .meta{color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.card h3{font-family:var(--f-head);font-size:16px;font-weight:600;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.card h3 .n{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-weight:400}
.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;align-items:start}
.stack{display:flex;flex-direction:column;gap:18px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.kpi .v{font-family:var(--f-mono);font-size:24px;font-weight:500;font-variant-numeric:tabular-nums}
.kpi .l{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.kpi.bad .v{color:var(--bad)} .kpi.warn .v{color:var(--warn)} .kpi.ok .v{color:var(--ok)}
.items{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:10px;padding:9px 0;border-top:1px solid var(--line);align-items:start;cursor:pointer}
.item:first-child{border-top:0}
.item:hover .it{text-decoration:underline}
.dot{width:9px;height:9px;border-radius:50%;margin-top:5px;background:var(--info)}
.dot.bad{background:var(--bad)} .dot.warn{background:var(--warn)} .dot.ok{background:var(--ok)}
.it{font-weight:500} .is{color:var(--muted);font-size:12.5px}
.tag{font-size:11.5px;color:var(--muted);white-space:nowrap}
.empty{color:var(--muted);padding:8px 0}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:10px;background:var(--info-soft);color:var(--info);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
.btn{font:inherit;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:6px 12px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.sm{padding:3px 9px;font-size:12.5px}
.btn:focus-visible,.nav a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.chipf{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:14px;padding:4px 11px;font:inherit;font-size:12.5px;cursor:pointer}
.chipf.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.ship{display:flex;flex-direction:column;gap:10px}
.shead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:flex-start}
.stitle{font-family:var(--f-head);font-size:17px;font-weight:600}
.route{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px 16px;font-size:13px}
.facts div span{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.facts b{font-weight:500;font-variant-numeric:tabular-nums}
.late{color:var(--bad);font-weight:600}
.steps{display:flex;gap:0;overflow-x:auto;padding-bottom:2px}
.st{flex:1 1 0;min-width:78px;display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--muted)}
.st i{display:block;height:5px;background:var(--line);margin-right:3px;border-radius:2px}
.st.done i{background:var(--ok)} .st.cur i{background:var(--accent)} .st.cur{color:var(--ink);font-weight:600}
.blk{display:flex;flex-wrap:wrap;gap:6px}
.log{border-left:2px solid var(--line);padding-left:12px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.log .d{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);margin-right:8px}
.latest{background:var(--sunk);border-radius:6px;padding:8px 10px;font-size:13px}
.latest .d{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);margin-right:8px}
.tw{overflow-x:auto;min-width:0}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tr.hold td{background:var(--warn-soft)}
.secrow td{background:var(--sunk);font-weight:600}
.grid{font-size:12px}
.grid th,.grid td{padding:4px 6px;text-align:right;font-family:var(--f-mono);white-space:nowrap;border-bottom:1px solid var(--line)}
.grid th.sl,.grid td.sl{position:sticky;left:0;background:var(--surface);text-align:left;font-family:var(--f-body);z-index:1;min-width:150px}
.grid td.off{background:var(--sunk);color:var(--muted)}
.grid th.today,.grid td.today{box-shadow:inset 2px 0 0 var(--accent),inset -2px 0 0 var(--accent)}
.grid tr.act td{color:var(--ink)} .grid tr.pl td{color:var(--muted)}
.grid td.under{color:var(--bad);font-weight:500} .grid td.over{color:var(--ok);font-weight:500}
.grid input{width:52px;font:inherit;text-align:right;border:1px solid var(--line);border-radius:3px;background:var(--surface);color:var(--ink);padding:1px 3px}
.grid .hl{font-size:10px;color:var(--warn);font-family:var(--f-body)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--accent)}
.bar.ok i{background:var(--ok)}
.sugg{border-left:3px solid var(--warn);background:var(--warn-soft);padding:10px 14px;border-radius:0 6px 6px 0;display:flex;flex-direction:column;gap:4px}
.sugg.ok{border-color:var(--ok);background:var(--ok-soft)}
.agenda{display:flex;flex-direction:column;gap:12px}
.aday b{font-family:var(--f-head);font-weight:600;font-size:13px;display:block;margin-bottom:4px}
.aday b.td{color:var(--accent)}
.aday ul{margin:0;padding-left:16px;font-size:13px;color:var(--ink)} .aday li{margin:2px 0}
.aday .none{color:var(--muted);font-size:12.5px}
.banner{padding:10px 14px;border-radius:6px;background:var(--info-soft);color:var(--info)}
.banner.bad{background:var(--bad-soft);color:var(--bad)}
.issue{display:flex;flex-direction:column;gap:8px}
.ihead{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between}
.it2{font-weight:600;font-size:15px}
.muted{color:var(--muted)} .mono{font-family:var(--f-mono)}
.modal-bg{position:fixed;inset:0;background:rgba(10,16,24,.45);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));z-index:50;overflow-y:auto}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:10px;width:min(760px,100%);padding:18px;display:flex;flex-direction:column;gap:14px}
.modal h4{font-family:var(--f-head);font-size:19px;margin:0}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 14px}
.fgrid label,.fl{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.fgrid .wide{grid-column:1/-1}
input,select,textarea{font:inherit;font-size:13.5px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0;width:100%}
textarea{min-height:74px;resize:vertical}
.mact{display:flex;justify-content:flex-end;gap:8px}
.err{color:var(--bad);font-size:13px}
.stbl input{padding:4px 6px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{border:0;background:none;font:inherit;font-weight:500;color:var(--muted);padding:8px 12px;border-bottom:2px solid transparent;cursor:pointer}
.tabs button.on{color:var(--ink);border-color:var(--accent)}
.grp{font-family:var(--f-head);font-size:15px;font-weight:600;margin:4px 0 -6px;color:var(--muted)}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;z-index:60}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr);gap:14px}
  .side{position:static}
  .nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
  .nav a{white-space:nowrap}
  .cols{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- helpers ---------- */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const TODAY=iso(new Date());
const pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d)};
const diff=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const dow=s=>pd(s).getDay();
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fd(s){if(!s)return '—';const d=pd(s);return lang==='zh'?(d.getMonth()+1)+'/'+d.getDate():MON[d.getMonth()]+' '+d.getDate()}
function fdw(s){return t('wd'+dow(s))+' '+fd(s)}
const num=n=>(n==null||n==='')?'—':Number(n).toLocaleString('en-US');
const pct=(a,b)=>b?(a/b*100):0;
const fp=x=>x.toFixed(2)+'%';
const clone=o=>JSON.parse(JSON.stringify(o));
const lastLog=o=>(o.log&&o.log.length)?o.log.reduce((m,x)=>x.d>m.d?x:m,o.log[0]):null;
const sortLog=l=>(l||[]).slice().sort((a,b)=>b.d.localeCompare(a.d));

/* ---------- data ---------- */
async function boot(){
  renderNav();renderMain();
  const c=window.claude;
  if(!c||!c.use){S.state='none';renderMain();return}
  let db=null,user=null;
  try{[db,user]=await Promise.all([c.use('db'),c.use('user')])}catch(e){}
  if(user){try{S.isOwner=await user.isOwner()}catch(e){}}
  if(!db){S.state='none';renderAll();return}
  S.db=db;
  const timer=setTimeout(()=>{if(S.state==='loading'){S.state='timeout';renderMain()}},10000);
  COLS.forEach(col=>{
    db.collection(col).onSnapshot(snap=>{
      S[col]=snap.docs.map(d=>Object.assign({id:d.id},d.data()));
      S.loaded[col]=true;
      if(COLS.every(k=>S.loaded[k])){S.state='ok';clearTimeout(timer)}
      renderAll();
    },err=>{S.state='none';clearTimeout(timer);renderAll()});
  });
  db.doc('meta/settings').onSnapshot(s=>{if(s.exists)S.settings=Object.assign({meetingDay:4,staleDays:3,window:3},s.data());renderAll()},()=>{});
}

}

/* ---------- derived: material status ---------- */
function matStatus(s){
  if(s.stage>=7)return 'arrived';
  if(s.stage>=4)return 'shipped';
  if(s.stage>=1)return 'ready';
  return 'waiting';
}
function shipLate(s){
  const eta=s.etaActual||s.etaPlan;
  if(s.etaPlan&&!s.etaActual&&s.stage<5&&s.etaPlan<TODAY)return diff(s.etaPlan,TODAY);
  if(s.etaPlan&&s.etaActual&&s.etaActual>s.etaPlan)return diff(s.etaPlan,s.etaActual);
  return 0;
}

/* ---------- production plan engine ---------- */
function genPlan(p,mode){
  const start=p.startDate;
  let last=start;(p.milestones||[]).forEach(m=>{if(m.d>last)last=m.d});if(TODAY>last)last=TODAY;
  const end=addDays(last,75);const days=[];
  for(let d=start;d<=end&&days.length<240;d=addDays(d,1))days.push(d);
  const hol=new Set((p.holidays||[]).map(h=>h.d));const wd=new Set(p.workDays||[1,2,3,4,5,6]);
  const isWork=d=>wd.has(dow(d))&&!hol.has(d);
  const res={};
  (p.stages||[]).forEach(s=>{
    const act=(p.actuals||{})[s.key]||{};const pred=s.pred&&res[s.pred];const lag=+s.lag||0;const ramp=s.ramp||[];
    let cum=0,prod=0;const daily={},cumArr=[];
    days.forEach((d,i)=>{
      let q=0;
      if(mode==='forecast'&&d<TODAY){q=+act[d]||0}
      else if(isWork(d)&&d>=(s.notBefore||start)&&cum<s.target){
        const rf=prod<ramp.length?ramp[prod]:100;const capQ=Math.round(s.cap*rf/100);
        let avail=Infinity;if(pred){const j=i-lag;avail=(j>=0?pred.cumArr[j]:0)-cum}
        q=Math.max(0,Math.min(capQ,s.target-cum,avail));
      }
      if(q>0)prod++;cum+=q;daily[d]=q;cumArr.push(cum);
    });
    const fi=cumArr.findIndex(c=>c>=s.target);
    res[s.key]={daily,cumArr,finish:fi>=0?days[fi]:null,total:cum};
  });
  return {days,res,isWork,hol};
}
function actualCum(p,key,upTo){const a=(p.actuals||{})[key]||{};let c=0;for(const d in a)if(!upTo||d<=upTo)c+=+a[d]||0;return c}
function expectedCum(p,g,key,d){
  const a=(p.actuals||{})[key]||{};const lastA=Object.keys(a).filter(x=>x<=d).sort().pop()||'';
  const tp=((p.tsmtPlan||{})[key]);
  if(tp&&Object.keys(tp).length){let c=actualCum(p,key,lastA||'0000');for(const x in tp)if(x>lastA&&x<=d)c+=+tp[x]||0;return Math.min(c,(p.stages.find(s=>s.key===key)||{}).target||c)}
  return cumAt(g,key,d);
}
function cumAt(g,key,d){const r=g.res[key];if(!r)return 0;const i=g.days.indexOf(d);if(i>=0)return r.cumArr[i];return d<g.days[0]?0:r.total}
function analysePlan(p){
  const g=genPlan(p,'forecast');const fin=p.finalStage||(p.stages[p.stages.length-1]||{}).key;const fr=g.res[fin];
  const ms=(p.milestones||[]).map(m=>{const c=cumAt(g,fin,m.d);const ri=fr?fr.cumArr.findIndex(x=>x>=m.qty):-1;return Object.assign({},m,{cum:c,short:Math.max(0,m.qty-c),reach:ri>=0?g.days[ri]:null})});
  const gap=ms.find(m=>m.short>0&&m.d>=TODAY);
  let sugg=[];
  if(gap){
    let W=0,M=[];for(let d=TODAY;d<=gap.d;d=addDays(d,1)){if(g.isWork(d))W++;else M.push(d)}
    let worst=null;
    p.stages.forEach(s=>{
      const done=cumAt(g,s.key,addDays(TODAY,-1));const need=Math.max(0,Math.min(gap.qty,s.target)-done);
      if(!need||!W)return;const req=Math.ceil(need/W);
      if(req>s.cap){sugg.push({type:'cap',st:s.name,a:s.cap,b:req,p:Math.round((req/s.cap-1)*100)})}
      const r=need/s.cap;if(!worst||r>worst.r)worst={r,s,need};
    });
    if(worst){const extra=Math.ceil(worst.need/worst.s.cap)-W;if(extra>0)sugg.push({type:'days',n:extra,d:gap.d,m:M.map(fd).join(', ')||'—'})}
    if(gap.reach)sugg.push({type:'delay',d:gap.reach});
  }
  return {g,fin,ms,gap,sugg};
}

/* ---------- agenda (Today) ---------- */
function buildAgenda(){
  const st=S.settings,W=+st.window||3,stale=+st.staleDays||3;const out=[];
  const push=(grp,sev,text,sub,go,id)=>out.push({grp,sev,text,sub,go,id});
  S.shipments.forEach(s=>{
    if(s.stage>=7)return;const nm=s.title;
    if(s.etdPlan&&!s.etdActual&&s.stage<4){
      if(s.etdPlan<TODAY)push('confirm','bad',t('a_etdPassed',{d:fd(s.etdPlan)}),nm,'shipments',s.id);
      else if(diff(TODAY,s.etdPlan)<=W)push('confirm','warn',t('a_etdSoon',{d:fd(s.etdPlan)}),nm,'shipments',s.id);
    }
    if(s.etaPlan&&!s.etaActual&&s.stage<5&&s.stage>=4){
      if(s.etaPlan<TODAY)push('confirm','bad',t('a_etaPassed',{d:fd(s.etaPlan)}),nm,'shipments',s.id);
      else if(diff(TODAY,s.etaPlan)<=W)push('confirm','warn',t('a_etaSoon',{d:fd(s.etaPlan)}),nm,'shipments',s.id);
    }
    if(s.category==='material'&&s.readyDate&&s.stage<1){
      if(s.readyDate<TODAY)push('confirm','bad',t('a_readyPassed',{d:fd(s.readyDate)}),nm,'materials',s.id);
      else if(diff(TODAY,s.readyDate)<=W)push('prepare','warn',t('a_readySoon',{d:fd(s.readyDate)}),nm,'materials',s.id);
    }
    if(s.alert)push('due','bad',t('a_alert',{x:t('m_'+s.alert)}),nm,s.category==='material'?'materials':'shipments',s.id);
    (s.blockers||[]).filter(b=>!b.done).forEach(b=>push('due','warn',t('a_blocker',{g:t('b_'+b.group),x:b.detail,n:b.since?diff(b.since,TODAY):0}),nm,'shipments',s.id));
    const ll=lastLog(s);if(ll&&diff(ll.d,TODAY)>stale)push('confirm','info',t('a_stale',{n:diff(ll.d,TODAY)}),nm,s.category==='material'?'materials':'shipments',s.id);
  });
  S.outbound.forEach(o=>{
    if(o.stage>=5)return;const nm=(o.customer||'')+' · '+(o.model||'')+' · '+num(o.qty)+' pcs';
    if(o.shipPlan&&o.stage<4){
      if(o.shipPlan<TODAY)push('confirm','bad',t('a_obPassed',{d:fd(o.shipPlan)}),nm,'outbound',o.id);
      else if(diff(TODAY,o.shipPlan)<=W)push('confirm','warn',t('a_obSoon',{d:fd(o.shipPlan)}),nm,'outbound',o.id);
    }
    const ll=lastLog(o);if(ll&&diff(ll.d,TODAY)>stale)push('confirm','info',t('a_stale',{n:diff(ll.d,TODAY)}),nm,'outbound',o.id);
  });
  S.issues.forEach(i=>{
    if(i.status==='closed')return;const nm=i.topic+' · '+(i.project||'');
    if(i.dueDate&&i.dueDate<TODAY)push('due','bad',t('a_overdue',{d:fd(i.dueDate),n:diff(i.dueDate,TODAY)}),nm,'issues',i.id);
    else if(i.dueDate&&diff(TODAY,i.dueDate)<=2)push('due','warn',t('a_dueSoon',{d:fd(i.dueDate)}),nm,'issues',i.id);
    const ll=lastLog(i);if(ll&&diff(ll.d,TODAY)>7&&!(i.dueDate&&i.dueDate<TODAY))push('confirm','info',t('a_stale',{n:diff(ll.d,TODAY)}),nm,'issues',i.id);
  });
  S.todos.forEach(x=>{if(!x.done&&x.due&&x.due<=TODAY)push('due',x.due<TODAY?'bad':'warn',t('a_todo',{d:fd(x.due)}),x.text,'today',x.id)});
  S.plans.filter(p=>p.active!==false).forEach(p=>{
    const a=analysePlan(p);
    if(a.gap)push('prepare','bad',t('a_dprShort',{n:num(a.gap.short),q:num(a.gap.qty),d:fd(a.gap.d)}),p.name,'dpr',p.id);
    const proj=p.project;
    const todayR=S.qa.filter(r=>r.date===TODAY&&r.project===proj).length;
    if(dow(TODAY)!==0&&todayR<2)push('prepare','info',t('a_qa',{n:todayR}),p.name,'production',null);
    const y=addDays(TODAY,-1);
    if(dow(y)!==0&&!(p.holidays||[]).some(h=>h.d===y)&&!S.qa.some(r=>r.date===y&&r.project===proj))push('confirm','warn',t('a_qaY',{d:fd(y)}),p.name,'production',null);
  });
  const md=+S.settings.meetingDay;let nm=TODAY;while(dow(nm)!==md)nm=addDays(nm,1);
  if(diff(TODAY,nm)<=2){
    const lastM=addDays(nm,-7);const open=S.issues.filter(i=>i.status!=='closed');
    const notUpd=open.filter(i=>{const l=lastLog(i);return !l||l.d<=lastM}).length;
    push('prepare','info',t('a_meeting',{d:fdw(nm),n:open.length,m:notUpd}),'','issues',null);
  }
  return {items:out,nextMeeting:nm};
}
function next7(nextMeeting){
  const days=[];for(let i=0;i<8;i++)days.push(addDays(TODAY,i));const ev={};days.forEach(d=>ev[d]=[]);
  const add=(d,txt)=>{if(ev[d])ev[d].push(txt)};
  S.shipments.forEach(s=>{if(s.stage>=7)return;if(s.etdPlan&&!s.etdActual)add(s.etdPlan,t('e_etd')+' · '+s.title);if(s.etaPlan&&!s.etaActual)add(s.etaPlan,t('e_eta')+' · '+s.title);if(s.readyDate&&s.stage<1)add(s.readyDate,t('e_ready')+' · '+s.title)});
  S.outbound.forEach(o=>{if(o.stage<4&&o.shipPlan)add(o.shipPlan,t('e_ship')+' · '+o.customer+' '+num(o.qty))});
  S.issues.forEach(i=>{if(i.status!=='closed'&&i.dueDate)add(i.dueDate,t('e_due')+' · '+i.topic)});
  S.todos.forEach(x=>{if(!x.done&&x.due)add(x.due,'☐ '+x.text)});
  S.plans.forEach(p=>{(p.milestones||[]).forEach(m=>add(m.d,t('e_ms')+' · '+p.name+' '+num(m.qty)));(p.holidays||[]).forEach(h=>add(h.d,t('e_hol')+' · '+(h.label||'')))});
  add(nextMeeting,t('e_meet'));
  return days.map(d=>({d,list:ev[d]}));
}

function field(f,v){
  const id='f_'+f.k;const val=v==null?'':v;const lab=`<span>${esc(f.label)}</span>`;const cls=f.wide?'wide':'';
  if(f.type==='select')return `<label class="${cls}">${lab}<select id="${id}">${f.opts.map(([a,b])=>`<option value="${esc(a)}" ${String(a)===String(val)?'selected':''}>${esc(b)}</option>`).join('')}</select></label>`;
  if(f.type==='textarea')return `<label class="${cls}">${lab}<textarea id="${id}">${esc(val)}</textarea></label>`;
  return `<label class="${cls}">${lab}<input id="${id}" type="${f.type||'text'}" value="${esc(val)}"></label>`;
}
function readF(fields){const o={};fields.forEach(f=>{const el=document.getElementById('f_'+f.k);if(!el)return;let v=el.value;if(f.type==='number')v=v===''?null:Number(v);if(f.k==='stage')v=Number(v);o[f.k]=v});return o}

  modal(t('btn_blocker'),`<div class="fgrid">${f.map(x=>field(x,x.k==='since'?TODAY:''))}</div>`,async()=>{
    const v=readF(f);if(!v.detail.trim())return false;const cur=S.shipments.find(x=>x.id===id);
    await patch('shipments',id,{blockers:(cur.blockers||[]).concat([{group:v.group,detail:v.detail.trim(),since:v.since||TODAY,done:false}])});
  });
}
function closeIssue(id){
  const i=S.issues.find(x=>x.id===id);
  modal(t('btn_close')+': '+i.topic,`<div class="fgrid">${field({k:'closeDate',label:t('l_closed'),type:'date'},TODAY)}${field({k:'closeReason',label:t('l_reason'),type:'textarea',wide:true},i.closeReason||'')}</div>`,async()=>{
    const v=readF([{k:'closeDate'},{k:'closeReason'}]);const log=(i.log||[]).concat([{d:v.closeDate||TODAY,text:'Closed. '+v.closeReason}]);
    await patch('issues',id,{status:'closed',closeDate:v.closeDate||TODAY,closeReason:v.closeReason,log});
  });
}
function settingsModal(){
  const f=[{k:'meetingDay',label:t('mt_meet'),type:'select',opts:[0,1,2,3,4,5,6].map(d=>[d,t('wd'+d)])},{k:'staleDays',label:t('mt_stale'),type:'number'},{k:'window',label:t('mt_win'),type:'number'},{k:'email',label:t('mt_email')}];
  modal(t('mt_title'),`<div class="fgrid">${f.map(x=>field(x,S.settings[x.k]))}</div>`,async()=>{const v=readF(f);v.meetingDay=+v.meetingDay;await S.db.doc('meta/settings').set(Object.assign({},S.settings,v));toast(t('saved'))});
}
function qaModal(){
  const f=[{k:'date',label:t('l_date'),type:'date'},{k:'time',label:'Time'},{k:'shift',label:t('pq_shift'),type:'select',opts:[['A','A'],['B','B'],['C','C'],['Day','Day'],['Night','Night']]},{k:'project',label:t('l_project')},
    {k:'planId',label:t('nav_dpr'),type:'select',opts:[['','—']].concat(S.plans.map(p=>[p.id,p.name]))},{k:'reporter',label:t('pq_by')},{k:'section',label:t('pq_section'),wide:true},{k:'paste',label:t('pq_paste'),type:'textarea',wide:true}];
  const last=S.qa.slice().sort((a,b)=>b.date.localeCompare(a.date))[0]||{};
  modal(t('btn_addReport'),`<div class="fgrid">${f.map(x=>field(x,{date:TODAY,project:last.project||'',planId:last.planId||'',reporter:last.reporter||'',section:'Overall data'}[x.k]))}<label class="wide" style="flex-direction:row;gap:8px;align-items:center"><input type="checkbox" id="f_hold" style="width:auto"> ${t('pq_isHold')}</label></div>`,async()=>{
    const v=readF(f);const rows=parseQa(v.paste);if(!rows.length){document.getElementById('mErr').textContent='No rows found.';return false}
    const ex=S.qa.find(r=>r.date===v.date&&r.shift===v.shift&&r.project===v.project);
    const sec={name:v.section||'Overall data',hold:document.getElementById('f_hold').checked,rows};
    if(ex){const d=clone(ex);delete d.id;d.sections=(d.sections||[]).filter(s=>s.name!==sec.name).concat([sec]);await put('qa',ex.id,d)}
    else await put('qa',newId('qa'),{date:v.date,time:v.time,shift:v.shift,project:v.project,planId:v.planId,reporter:v.reporter,sections:[sec]});
  });
}
function parseQa(txt){
  const out=[];(txt||'').split(/\r?\n/).forEach(line=>{
    let c=line.split('\t').map(x=>x.trim());if(c.length<5)return;
    if(/^\d+$/.test(c[0])&&!/^\d+$/.test(c[1]||''))c=c.slice(1);
    const n=i=>{const x=String(c[i]||'').replace(/[,%]/g,'');return x===''?0:Number(x)};
    if(isNaN(n(2)))return;
    out.push({part:c[0],station:c[1],input:n(2),p1:n(3),f1:n(4),p2:n(5),f2:n(6),rework:n(10)||'',ntf:n(11)||'',note:c.slice(12).join(' ')});
  });return out;
}
function mapQa(id){
  const r=S.qa.find(x=>x.id===id);const plan=S.plans.find(p=>p.id===r.planId)||S.plans.find(p=>p.project===r.project);if(!plan)return;
  const rows=[];(r.sections||[]).forEach((s,si)=>s.rows.forEach((x,ri)=>rows.push({si,ri,x,s})));
  modal(t('pq_stage'),`<div class="tw"><table><tbody>${rows.map(o=>`<tr><td>${esc(o.s.name.slice(0,20))}</td><td>${esc(o.x.station)}</td><td><select id="mp_${o.si}_${o.ri}"><option value="">—</option>${plan.stages.map(st=>`<option value="${st.key}" ${o.x.stage===st.key?'selected':''}>${esc(st.name)}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div>`,async()=>{
    const d=clone(r);delete d.id;rows.forEach(o=>{d.sections[o.si].rows[o.ri].stage=document.getElementById(`mp_${o.si}_${o.ri}`).value});await put('qa',id,d);
  });
}
function planModal(id){
  const p=id?clone(S.plans.find(x=>x.id===id)):{name:'',project:'',customer:'',lotQty:6400,startDate:TODAY,workDays:[1,2,3,4,5,6],holidays:[],milestones:[],events:[],finalStage:'PACK',
    stages:[{key:'SMT',name:'SMT',target:6400,cap:500,pred:'',lag:0,ramp:[50,80]},{key:'ASSY',name:'Assembly',target:6400,cap:350,pred:'SMT',lag:1,ramp:[50,80]},{key:'TEST',name:'Testing',target:6400,cap:350,pred:'ASSY',lag:0,ramp:[]},{key:'PACK',name:'Packing',target:6400,cap:350,pred:'TEST',lag:0,ramp:[]}],actuals:{}};
  const lines=(arr,fmt)=>(arr||[]).map(fmt).join('\n');
  const stRow=(s,i)=>`<tr><td><input id="sk_${i}" value="${esc(s.key)}" style="width:70px"></td><td><input id="sn_${i}" value="${esc(s.name)}"></td><td><input id="st_${i}" type="number" value="${s.target}" style="width:80px"></td><td><input id="sc_${i}" type="number" value="${s.cap}" style="width:70px"></td><td><input id="sp_${i}" value="${esc(s.pred||'')}" style="width:70px"></td><td><input id="sl_${i}" type="number" value="${s.lag||0}" style="width:50px"></td><td><input id="sb_${i}" type="date" value="${s.notBefore||''}"></td><td><input id="sr_${i}" value="${(s.ramp||[]).join('/')}" style="width:80px"></td></tr>`;
  const body=`<div class="fgrid">${field({k:'name',label:t('d_name')},p.name)}${field({k:'project',label:t('l_project')},p.project)}${field({k:'customer',label:t('l_customer')},p.customer)}${field({k:'lotQty',label:t('d_lot'),type:'number'},p.lotQty)}${field({k:'startDate',label:t('d_start'),type:'date'},p.startDate)}${field({k:'finalStage',label:t('d_final')},p.finalStage)}
   <div class="fl wide"><span>${t('d_wd')}</span><div class="row">${[1,2,3,4,5,6,0].map(d=>`<label style="flex-direction:row;gap:4px;display:flex;align-items:center"><input type="checkbox" id="wd_${d}" style="width:auto" ${(p.workDays||[]).includes(d)?'checked':''}>${t('wd'+d)}</label>`).join('')}</div></div>
   ${field({k:'holidays',label:t('d_hol')+' (YYYY-MM-DD label)',type:'textarea'},lines(p.holidays,h=>h.d+' '+(h.label||'')))}
   ${field({k:'milestones',label:t('d_ms')+' (YYYY-MM-DD qty label)',type:'textarea'},lines(p.milestones,m=>m.d+' '+m.qty+' '+(m.label||'')))}
   ${field({k:'events',label:t('d_events')+' (YYYY-MM-DD label)',type:'textarea',wide:true},lines(p.events,e=>e.d+' '+e.label))}</div>
   <div class="tw"><table class="stbl"><thead><tr><th>${t('d_key')}</th><th>${t('d_name')}</th><th>${t('d_target')}</th><th>${t('d_cap')}</th><th>${t('d_pred')}</th><th>Lag</th><th>${t('d_nb')}</th><th>${t('d_ramp')}</th></tr></thead><tbody id="stBody">${p.stages.map(stRow).join('')}</tbody></table></div>
   <div class="row"><button class="btn sm" id="addStage">+ ${t('d_stage')}</button></div>`;
  modal(id?t('btn_settings'):t('btn_newplan'),body,async()=>{
    const v=readF([{k:'name'},{k:'project'},{k:'customer'},{k:'lotQty',type:'number'},{k:'startDate'},{k:'finalStage'},{k:'holidays'},{k:'milestones'},{k:'events'}]);
    const pl=s=>s.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
    p.name=v.name||'Lot plan';p.project=v.project;p.customer=v.customer;p.lotQty=v.lotQty||0;p.startDate=v.startDate||TODAY;p.finalStage=v.finalStage;
    p.workDays=[0,1,2,3,4,5,6].filter(d=>document.getElementById('wd_'+d).checked);
    p.holidays=pl(v.holidays).map(x=>{const[d,...r]=x.split(/\s+/);return {d,label:r.join(' ')}}).filter(h=>/^\d{4}-\d\d-\d\d$/.test(h.d));
    p.milestones=pl(v.milestones).map(x=>{const[d,q,...r]=x.split(/\s+/);return {d,qty:Number(q)||0,label:r.join(' ')}}).filter(h=>/^\d{4}-\d\d-\d\d$/.test(h.d));
    p.events=pl(v.events).map(x=>{const[d,...r]=x.split(/\s+/);return {d,label:r.join(' ')}}).filter(h=>/^\d{4}-\d\d-\d\d$/.test(h.d));
    const n=document.querySelectorAll('#stBody tr').length;const st=[];
    for(let i=0;i<n;i++){const k=document.getElementById('sk_'+i).value.trim();if(!k)continue;st.push({key:k,name:document.getElementById('sn_'+i).value.trim()||k,target:+document.getElementById('st_'+i).value||0,cap:+document.getElementById('sc_'+i).value||0,pred:document.getElementById('sp_'+i).value.trim(),lag:+document.getElementById('sl_'+i).value||0,notBefore:document.getElementById('sb_'+i).value||'',ramp:document.getElementById('sr_'+i).value.split('/').map(Number).filter(x=>x>0)})}
    p.stages=st;if(!st.some(s=>s.key===p.finalStage)&&st.length)p.finalStage=st[st.length-1].key;
    const did=id||newId('plans');delete p.id;await put('plans',did,p);S.planId=did;
  });
  document.getElementById('addStage').onclick=e=>{e.preventDefault();const b=document.getElementById('stBody');const i=b.querySelectorAll('tr').length;b.insertAdjacentHTML('beforeend',stRow({key:'',name:'',target:p.lotQty||0,cap:0,pred:'',lag:0,ramp:[]},i))};
}

/* ---------- actions ---------- */
const ACT={
  lang:d=>{lang=d.v;try{localStorage.setItem('tsmt_lang',lang)}catch(e){}document.documentElement.lang=lang==='zh'?'zh-Hant':'en';renderAll()},
  nav:d=>{S.view=d.v;try{history.replaceState(null,'','#'+d.v)}catch(e){}renderAll();window.scrollTo(0,0)},
  go:d=>{if(d.go==='today')return;ACT.nav({v:d.go});if(d.id){S.open.add(d.id);if(d.go==='dpr')S.planId=d.id;setTimeout(()=>{const el=document.getElementById('c_'+d.id);if(el){el.scrollIntoView({block:'start',behavior:'smooth'});el.style.outline='2px solid var(--accent)';setTimeout(()=>el.style.outline='',1600)}},60)}},
  filter:d=>{S[d.k]=d.v;renderMain()},
  toggle:d=>{S.open.has(d.id)?S.open.delete(d.id):S.open.add(d.id);renderMain()},
  addLog:d=>addLog(d.col,d.id),addBlk:d=>addBlk(d.id),
  resolveBlk:async(d,el,e)=>{e.preventDefault();const s=S.shipments.find(x=>x.id===d.id);const b=clone(s.blockers);const it=b[+d.i];it.done=true;it.doneDate=TODAY;await patch('shipments',d.id,{blockers:b,log:(s.log||[]).concat([{d:TODAY,text:'Resolved: '+t('b_'+it.group)+' – '+it.detail}])})},
  nextStep:async d=>{const col=d.col;const o=S[col].find(x=>x.id===d.id);const steps=col==='shipments'?STEPS:OB_STEPS;const ns=(o.stage??-1)+1;const up={stage:ns};
    if(col==='shipments'){if(steps[ns]==='shipped'&&!o.etdActual)up.etdActual=TODAY;if(steps[ns]==='arrived'&&!o.etaActual)up.etaActual=TODAY}
    else if(steps[ns]==='shipped'&&!o.shipActual)up.shipActual=TODAY;
    up.log=(o.log||[]).concat([{d:TODAY,text:'→ '+t((col==='shipments'?'s_':'o_')+steps[ns])}]);await patch(col,d.id,up)},
  editShip:d=>editDoc('shipments',d.id,shipFields(),{category:d.cat||'material',stage:-1,blockers:[]},d.id?t('btn_edit'):t('new_ship')),
  editOb:d=>editDoc('outbound',d.id,obFields(),{stage:0},d.id?t('btn_edit'):t('new_ob')),
  editIssue:d=>editDoc('issues',d.id,issueFields(),{status:'open',priority:'med',category:'other',openDate:TODAY},d.id?t('btn_edit'):t('new_issue')),
  closeIssue:d=>closeIssue(d.id),
  reopen:async d=>{const i=S.issues.find(x=>x.id===d.id);await patch('issues',d.id,{status:'progress',closeDate:'',log:(i.log||[]).concat([{d:TODAY,text:'Reopened'}])})},
  delDoc:async d=>{if(S.delArm!==d.id){S.delArm=d.id;const b=document.querySelector(`[data-a="delDoc"][data-id="${d.id}"]`);if(b)b.textContent=t('confirmDel');return}S.delArm=null;closeModal();await del(d.col,d.id)},
  todoAdd:async()=>{const tx=document.getElementById('todoText').value.trim();if(!tx)return;await put('todos',newId('todos'),{text:tx,due:document.getElementById('todoDue').value||'',done:false,created:TODAY})},
  todoDone:async d=>patch('todos',d.id,{done:true,doneDate:TODAY}),
  settings:()=>settingsModal(),addQa:()=>qaModal(),mapQa:d=>mapQa(d.id),
  pickQa:d=>{S.qaId=d.id;renderMain()},pickPlan:d=>{S.planId=d.id;renderMain()},
  gridAll:()=>{S.gridAll=!S.gridAll;renderMain()},showBase:()=>{S.showBase=!S.showBase;renderMain()},
  newPlan:()=>planModal(null),planSettings:d=>planModal(d.id),
  mClose:()=>closeModal(),bgClose:(d,el,e)=>{if(e.target===el)closeModal()}
};
document.addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(!a)return;const f=ACT[a.dataset.a];if(f){if(a.tagName==='A')e.preventDefault();f(a.dataset,a,e)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
document.addEventListener('change',async e=>{
  const el=e.target;
  if(el.id==='monthPick'){S.month=el.value||TODAY.slice(0,7);renderMain();return}
  if(el.dataset&&el.dataset.cell){const v=el.value.trim();const val=v===''?null:Number(v);if(v!==''&&isNaN(val))return;
    const p=S.plans.find(x=>x.id===el.dataset.plan);const act=clone(p.actuals||{});act[el.dataset.stage]=act[el.dataset.stage]||{};
    if(val==null)delete act[el.dataset.stage][el.dataset.d];else act[el.dataset.stage][el.dataset.d]=val;
    const doc=clone(p);delete doc.id;doc.actuals=act;await put('plans',p.id,doc)}
});
function route(){const h=(location.hash||'').slice(1);S.view=VIEWS.includes(h)?h:'today';renderAll()}
window.addEventListener('hashchange',route);
document.documentElement.lang=lang==='zh'?'zh-Hant':'en';
route();boot();
})();
</script>
